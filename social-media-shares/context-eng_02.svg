<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg" style="max-width:480px;height:auto;margin:1.5rem auto;display:block;">
  <!-- Big context circle -->
  <circle cx="300" cy="210" r="160" fill="#CCFBF1" stroke="#0D9488" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="300" y="100" text-anchor="middle" fill="#0F766E" font-family="sans-serif" font-size="13" font-weight="bold">CONTEXT</text>
  <!-- Small prompt circle -->
  <circle cx="300" cy="220" r="60" fill="#1E3A5F"/>
  <text x="300" y="225" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">Prompt</text>
  <!-- Left labels -->
  <rect x="10" y="100" width="120" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="125" text-anchor="middle" fill="#1E3A5F" font-family="sans-serif" font-size="11" font-weight="bold">Memory</text>
  <line x1="130" y1="120" x2="175" y2="160" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="10" y="200" width="120" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="225" text-anchor="middle" fill="#1E3A5F" font-family="sans-serif" font-size="11" font-weight="bold">Tools</text>
  <line x1="130" y1="220" x2="165" y2="220" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="10" y="300" width="120" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="325" text-anchor="middle" fill="#1E3A5F" font-family="sans-serif" font-size="11" font-weight="bold">Retrieved Data</text>
  <line x1="130" y1="320" x2="180" y2="290" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Right labels -->
  <rect x="470" y="100" width="120" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="530" y="125" text-anchor="middle" fill="#1E3A5F" font-family="sans-serif" font-size="11" font-weight="bold">Conv. History</text>
  <line x1="470" y1="120" x2="425" y2="160" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="470" y="200" width="120" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="530" y="225" text-anchor="middle" fill="#1E3A5F" font-family="sans-serif" font-size="11" font-weight="bold">System Prompt</text>
  <line x1="470" y1="220" x2="435" y2="220" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="470" y="300" width="120" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="530" y="325" text-anchor="middle" fill="#1E3A5F" font-family="sans-serif" font-size="11" font-weight="bold">Current State</text>
  <line x1="470" y1="320" x2="420" y2="290" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="4,4"/>
</svg>