<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 140" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;margin:1.5rem 0;">
  <rect x="10" y="10" width="240" height="120" rx="12" fill="#1E3A5F"/>
  <text x="130" y="55" text-anchor="middle" fill="#EF4444" font-family="sans-serif" font-size="42" font-weight="bold">10x</text>
  <text x="130" y="85" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="12">Token cost multiplier</text>
  <text x="130" y="102" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="12">in agentic loops</text>
  <rect x="280" y="10" width="240" height="120" rx="12" fill="#1E3A5F"/>
  <text x="400" y="55" text-anchor="middle" fill="#F59E0B" font-family="sans-serif" font-size="42" font-weight="bold">13M</text>
  <text x="400" y="85" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="12">Tokens burned in one</text>
  <text x="400" y="102" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="12">25-hour unattended run</text>
  <rect x="550" y="10" width="240" height="120" rx="12" fill="#1E3A5F"/>
  <text x="670" y="55" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-size="42" font-weight="bold">30K</text>
  <text x="670" y="85" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="12">Lines of code from a</text>
  <text x="670" y="102" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="12">single loop session</text>
</svg>