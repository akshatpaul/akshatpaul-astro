<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;margin:1.5rem 0;">
  <!-- Bad: Bloated -->
  <rect x="10" y="10" width="370" height="180" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <circle cx="40" cy="38" r="12" fill="#EF4444"/>
  <text x="40" y="43" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">✕</text>
  <text x="58" y="43" fill="#EF4444" font-family="sans-serif" font-size="14" font-weight="bold">Bloated Tool Set</text>
  <rect x="25" y="60" width="340" height="24" rx="4" fill="white"/>
  <text x="35" y="77" fill="#475569" font-family="sans-serif" font-size="11">get_user_data()</text>
  <rect x="25" y="88" width="340" height="24" rx="4" fill="white"/>
  <text x="35" y="105" fill="#475569" font-family="sans-serif" font-size="11">fetch_user_info()</text>
  <rect x="25" y="116" width="340" height="24" rx="4" fill="white"/>
  <text x="35" y="133" fill="#475569" font-family="sans-serif" font-size="11">retrieve_user_profile()</text>
  <rect x="25" y="144" width="340" height="24" rx="4" fill="white"/>
  <text x="35" y="161" fill="#475569" font-family="sans-serif" font-size="11">load_user_details()</text>
  <!-- Good: Lean -->
  <rect x="420" y="10" width="370" height="180" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <circle cx="450" cy="38" r="12" fill="#10B981"/>
  <text x="450" y="43" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">✓</text>
  <text x="468" y="43" fill="#10B981" font-family="sans-serif" font-size="14" font-weight="bold">Lean Tool Set</text>
  <rect x="435" y="65" width="340" height="32" rx="4" fill="white"/>
  <text x="445" y="82" fill="#1E3A5F" font-family="sans-serif" font-size="11" font-weight="bold">get_user(id)</text>
