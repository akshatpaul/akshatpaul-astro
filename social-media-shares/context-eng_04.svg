  <rect x="435" y="145" width="340" height="32" rx="4" fill="white"/>
  <text x="445" y="162" fill="#1E3A5F" font-family="sans-serif" font-size="11" font-weight="bold">update_record(id, data)</text>
  <text x="655" y="162" fill="#64748B" font-family="sans-serif" font-size="10" font-style="italic">Explicit write</text>
