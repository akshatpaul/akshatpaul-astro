<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;margin:1.5rem 0;">
  <!-- Persistent Layer (bottom, biggest) -->
  <rect x="10" y="160" width="780" height="70" rx="10" fill="#1E3A5F"/>
  <text x="40" y="195" fill="white" font-family="sans-serif" font-size="15" font-weight="bold">Persistent Layer</text>
  <text x="40" y="215" fill="#94A3B8" font-family="sans-serif" font-size="11" font-style="italic">Always present. Read every session.</text>
  <text x="430" y="200" fill="#94A3B8" font-family="sans-serif" font-size="11">CLAUDE.md  ·  System prompts  ·  Team rules  ·  .cursorrules</text>
  <!-- Session Layer (middle) -->
  <rect x="60" y="85" width="680" height="65" rx="10" fill="#0D9488"/>
  <text x="90" y="118" fill="white" font-family="sans-serif" font-size="15" font-weight="bold">Session Layer</text>
  <text x="90" y="137" fill="#CCFBF1" font-family="sans-serif" font-size="11" font-style="italic">Retrieved at runtime. Changes per task.</text>
  <text x="410" y="125" fill="#CCFBF1" font-family="sans-serif" font-size="11">RAG results  ·  Conv. history  ·  File contents  ·  Git diff</text>
  <!-- Transient Layer (top, smallest) -->
  <rect x="130" y="15" width="540" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="160" y="42" fill="#1E3A5F" font-family="sans-serif" font-size="14" font-weight="bold">Transient Layer</text>
  <text x="160" y="60" fill="#64748B" font-family="sans-serif" font-size="11" font-style="italic">Temporary. One operation.</text>
  <text x="420" y="50" fill="#64748B" font-family="sans-serif" font-size="11">Tool outputs  ·  API responses  ·  Test results</text>
  <!-- Labels -->
  <text x="770" y="30" text-anchor="end" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="bold">▲ More volatile</text>
  <text x="770" y="235" text-anchor="end" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="bold">▼ More stable</text>
</svg>